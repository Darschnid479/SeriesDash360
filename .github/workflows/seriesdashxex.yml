name: SeriesDashXEX tests
on:
  push:
    branches: [release/1.0, main]
    paths:
      - 'tools/SeriesDashXEX/**'
      - 'BUILD_XBOX360_NO_SDK.bat'
  pull_request:
    paths:
      - 'tools/SeriesDashXEX/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest tools/SeriesDashXEX/test_seriesdashxex.py -v
